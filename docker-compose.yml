services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ALBION_BASE_URL: ${ALBION_BASE_URL:?Set public HTTPS origin in .env}
      ALBION_COOKIE_SECURE: "1"
      ALBION_SESSION_HOURS: "12"
      ALBION_MAX_UPLOAD_GB: ${ALBION_MAX_UPLOAD_GB:-50}
      ALBION_STORAGE_QUOTA_GB: ${ALBION_STORAGE_QUOTA_GB:-0}
      ALBION_MIN_FREE_GB: ${ALBION_MIN_FREE_GB:-5}
      ALBION_MAX_ZIP_GB: ${ALBION_MAX_ZIP_GB:-50}
      ALBION_MAX_ZIP_FILES: ${ALBION_MAX_ZIP_FILES:-20000}
      ALBION_EXPORT_ALL_INTERNAL_ONLY: ${ALBION_EXPORT_ALL_INTERNAL_ONLY:-1}
      # Optional shared state:
      # ALBION_REDIS_URL: redis://redis:6379/0
      # ALBION_RATE_LIMIT_STORAGE_URI: redis://redis:6379/1

  # Optional shared state for multiple processes/replicas:
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - ./redis-data:/data
    volumes:
      - ./data:/app/data        # uploads, files_db.json, auth.json, tokens.json и пр.
    mem_limit: 1g
    # Порт наружу не публикуем — к приложению ходит только nginx по внутренней сети

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

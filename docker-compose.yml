services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data        # uploads, files_db.json, auth.json, tokens.json и пр.
    mem_limit: 1g
    # Порт наружу не публикуем — к приложению ходит только nginx по внутренней сети

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
